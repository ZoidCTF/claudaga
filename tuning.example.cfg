# Claudaga tuning, read from tuning.cfg in the working directory or else
# beside claudaga.exe. Uncomment a line and change its value to override
# it; anything left commented keeps the built-in default. The running
# game rereads the file when it changes. A file with any error is
# rejected whole and the game keeps the values it had.
#
# Generated from src/tuning.def by every build as tuning.example.cfg -
# copy it to tuning.cfg and edit the copy.

# --- the fighter ---
# PLAYER_SPEED = 1.6           # pixels per tick along the row [0.1-8]
# FIRE_COOLDOWN = 12           # ticks between shots [1-600]
# SHOT_SPEED = 4               # pixels per tick a shot climbs [0.5-32]
# SHOTS_SINGLE = 2             # shots in the air at once [1-4]
# SHOTS_DUAL = 4               # and for a paired fighter [1-4]
# DUAL_OFFSET = 8              # each hull's distance from the pair's centre [0-16]
# START_LIVES = 3              # fighters at the start of a game [1-99]
# RESPAWN_TICKS = 70           # ticks before a lost fighter comes back [1-6000]
# SPAWN_CLEAR_RADIUS = 34      # room the fighter needs before it returns [0-288]
# FIRST_EXTRA_LIFE = 20000     # score for the first extra fighter [1-100000000]
# EXTRA_LIFE_EVERY = 70000     # then one every this many [1-100000000]

# --- collision ---
# ENEMY_HIT_RADIUS = 7         # how close a shot must pass an enemy's centre [0-32]
# ENEMY_SHIP_RADIUS = 9        # how close an enemy's body kills the fighter [0-32]
# R_MISSILE_SHIP = 8           # how close a missile kills the fighter [0-32]

# --- the difficulty ramp ---
# RAMP_STAGES = 12             # stages from the easy end to the hard end [1-1000]
# ATTACK_INTERVAL = 105        # ticks between attacks, stage 1 [1-6000]
# ATTACK_INTERVAL_END = 44     # and at the hard end [1-6000]
# DIVE_SPEED_1 = 3.1           # pixels per tick down a dive, stage 1 [0.1-16]
# DIVE_SPEED_END = 4.3         # and at the hard end [0.1-16]
# DIVER_CAP_1 = 3              # dive groups in the air at once, stage 1 [1-6]
# DIVER_CAP_END = 6            # and at the hard end [1-6]
# SWAY_PERIOD_1 = 420          # ticks for one sway of the parked block, stage 1 [1-100000]
# SWAY_PERIOD_END = 240        # and at the hard end [1-100000]
# BURST_LEN_END = 3            # attacks per burst at the hard end [0-100]
# BURST_GAP = 24               # ticks between attacks inside a burst [0-6000]

# --- the formation ---
# ENTRY_SPEED = 2.6            # pixels per tick along an entry or return path [0.1-16]
# SWAY_AMP = 10                # pixels the parked block drifts either side [0-32]
# RETURN_SPACING = 20          # ticks between two enemies entering one return lane [0-6000]
# ESCORT_LEAD = 21             # how far along the path a boss's escorts ride ahead [0-64]
# ESCORT_SPREAD = 17           # and how far to either side [0-64]
# LIFT_SPEED = 3.2             # pixels per tick a board leaves or arrives [0.1-64]

# --- missiles ---
# ENEMY_SHOT_SPEED = 2.3       # pixels per tick a missile travels [0.1-16]
# FIRE_CHANCE_IN = 150         # one in this many, per diver, per tick, stage 1 [1-100000]
# FIRE_CHANCE_IN_END = 68      # and at the hard end [1-100000]
# ENTRY_FIRE_RATIO = 5         # how much less often an entering enemy shoots [1-1000]
# FIRE_MIN_WARNING = 28        # least warning a missile gives, in ticks [0-600]
# FIRE_MAX_SLOPE = 1           # aim cone: sideways per pixel down (1 = 45 degrees) [0-16]

# --- attack curves ---
# AIM_TILT = 1                 # sideways speed across the row, in fighter speeds [0-16]
# AIM_LEAD_UP = 20             # how far above its aim a curve lines up [0-200]
# AIM_Y_MIN = 216              # the highest a curve commits to its line [0-288]
# AIM_Y_VARY = 24              # and how much lower it may happen instead [0-288]
# AIM_SPREAD = 20              # pixels either side of the fighter an attack aims [0-112]
# AIM_OUTER = 26               # aim offset of the loop and the cross [0-112]
# AIM_INNER = 9                # aim offset of the plunge and the peel [0-112]
# AIM_SLANT_MIN = 0.35         # gentlest slant, as a share of the full tilt [0-1]
# AIM_SLANTS = 8               # slants to choose between [2-1000]
# BODY_GAP = 14                # room between a curve's body and its line-up [0-200]

# --- the beam ---
# BEAM_DESCEND = 56            # ticks to drop into position [1-6000]
# BEAM_OPEN = 18               # ticks to open [1-6000]
# BEAM_HOLD = 96               # ticks held open [0-6000]
# BEAM_CLOSE = 18              # ticks to close [1-6000]
# BEAM_HOVER_Y = 146           # how far down the boss hangs [0-288]
# BEAM_LEN = 122               # length of the cone below the boss [1-288]
# BEAM_TOP_HW = 5              # half-width at the top [0-112]
# BEAM_BOT_HW = 26             # half-width at the bottom [0-112]
# BEAM_BANDS = 16              # bands drawn down the cone [1-256]
# CAPTIVE_ABOVE = 15           # how far above its captor a caught fighter rides [0-64]
# CAPTURE_LIFT = 1.7           # pixels per tick a caught fighter is drawn up [0.1-32]
# CAPTURE_SPIN = 9             # degrees per tick it spins while taken [0-360]
# RESCUE_SPEED = 2.1           # pixels per tick a freed fighter descends [0.1-32]
# RESCUE_CENTRE_SPEED = 1.4    # pixels per tick the survivor walks to the middle [0.1-32]

# --- bonus rounds ---
# CHAL_SPEED_RAMP = 0.3        # how much faster the last round flies than the first [0-10]
# CHAL_SPEED_TRIM = 0.75       # flat speed trim on every round [0.05-10]
# CHALLENGE_HIT_SCORE = 100    # points per flyer caught [0-100000000]
# CHALLENGE_PERFECT = 10000    # points for catching every one [0-100000000]

# --- pacing ---
# STAGE_PAUSE = 120            # ticks between a cleared stage and the next [0-6000]
# GAME_OVER_TICKS = 240        # ticks GAME OVER holds [1-6000]
# RESULTS_TICKS = 420          # ticks the results screen holds [1-6000]
# EXTRA_MSG_TICKS = 120        # ticks the extra-fighter notice stays up [0-6000]
# HANDOVER_TICKS = 110         # ticks PLAYER N READY shows between turns [0-6000]
# IDLE_BEFORE_DEMO = 600       # ticks of nobody home before the demo [1-360000]
# DEMO_LENGTH = 1500           # ticks the demo plays for [1-360000]

# --- effects ---
# ENEMY_BLAST_LIFE = 26        # ticks an enemy explosion lasts [1-600]
# PLAYER_BLAST_LIFE = 42       # ticks the fighter's explosion lasts [1-600]
# SCORE_LIFE = 90              # ticks a score popup lasts [1-600]
# ENEMY_SHARDS = 11            # shards in an enemy explosion [0-64]
# PLAYER_SHARDS = 15           # shards in the fighter's explosion [0-64]

# --- controllers ---
# STICK_DEADZONE = 9000        # stick travel ignored around centre [0-32767]
# MENU_PRESS = 18000           # stick travel that counts as a menu press [1-32767]
# MENU_RELEASE = 9000          # and where it must fall back to before the next [0-32767]
